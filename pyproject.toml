[project]
name = "ch-ai-stock"
version = "0.1.0"
description = "AI Agent 기반 주식 거래 도우미"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "mesop>=0.12.0",
    "yfinance>=0.2.0",
    "finance-datareader>=0.9.0",
    "ta>=0.11.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "setuptools>=70.0.0",
    "litellm>=1.75.5",
    "anthropic>=0.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
